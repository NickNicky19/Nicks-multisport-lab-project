name: Check and publish research site

on:
  pull_request:
  push:
    branches: [main, implementation/nba-foundation, 'execution/guarded-pr-*']
  workflow_dispatch:
    inputs:
      daily_records_commit:
        description: Exact authorized daily records branch head to recover for publication (empty reads its current head)
        required: false
        type: string
      production_state_commit:
        description: Exact production registry branch head to recover independently (empty reads its current head)
        required: false
        type: string
      operating_diagnostic:
        description: Run the separately guarded synthetic eight-forecast timing diagnostic (no source capture, issuance, or deployment)
        required: false
        type: boolean
        default: false

      release_action:
        description: Guarded release only; none preserves ordinary site checks/publication
        required: false
        type: choice
        options: [none, plan, land]
        default: none
      release_pr:
        description: Exact pull request number for guarded release
        required: false
        type: string
      release_head:
        description: Exact reviewed 40-character pull request head
        required: false
        type: string
      release_policy_digest:
        description: Canonical readiness-policy digest; required only for confirmed landing
        required: false
        type: string
      release_confirmation:
        description: Exact owner confirmation; required only for confirmed landing
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: >-
      (github.event_name != 'workflow_dispatch' || !inputs.operating_diagnostic) &&
      (github.event_name != 'workflow_dispatch' || !inputs.release_action || inputs.release_action == 'none') &&
      !(github.event_name == 'push' && startsWith(github.ref, 'refs/heads/execution/guarded-pr-'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Final evidence may cite an earlier reviewed source-admission commit.
          # Preserve ancestry so later builds can authenticate that exact review.
          fetch-depth: 0
      - name: Fetch frozen manual-cycle provenance for source-byte checks
        run: |
          git fetch --no-tags --depth=1 origin \
            58530309cf384425e15f02fd9fa980899a4dc0bc \
            c19bcd67d4fefe7f818fed569c683db9cc5ab9fc
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - name: Verify software contracts
        run: |
          python3 -m unittest discover -s tests -v
          python3 -m multisport_lab.demo
          node --test --test-isolation=none web/tests/*.test.mjs
      - name: Independently recover admitted daily research originals for main publication
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          DAILY_RECORDS_COMMIT: ${{ inputs.daily_records_commit }}
        run: |
          if [ -n "$DAILY_RECORDS_COMMIT" ]; then
            python3 -m multisport_lab.sdv_daily_publication --records-commit "$DAILY_RECORDS_COMMIT"
          else
            python3 -m multisport_lab.sdv_daily_publication
          fi
      - name: Independently recover the admitted production registry for main publication
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCTION_STATE_COMMIT: ${{ inputs.production_state_commit }}
        run: |
          if [ -n "$PRODUCTION_STATE_COMMIT" ]; then
            python3 -m multisport_lab.sdv_production_publication --state-commit "$PRODUCTION_STATE_COMMIT"
          else
            python3 -m multisport_lab.sdv_production_publication
          fi
      - name: Restore strictly verified prior production data for failure retention
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/restore_pages_artifact.py --output output
      - name: Build bounded static research artifact
        env:
          BUILD_COMMIT: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m multisport_lab.publication --build-commit "$BUILD_COMMIT"
          node web/tests/site-smoke.mjs output
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: output

  operating-diagnostic:
    if: >-
      github.repository == 'NickNicky19/Nicks-multisport-lab-project' &&
      github.event_name == 'workflow_dispatch' && inputs.operating_diagnostic &&
      (!inputs.release_action || inputs.release_action == 'none')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: nba-ops002-diagnostic-writer
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Prepare existing GitHub authentication for the isolated diagnostic writer
        run: gh auth setup-git
      - name: Measure actual host execution, durable checkpointing and independent recovery
        run: |
          python3 -m multisport_lab.operating_diagnostic \
            --producer-commit "$GITHUB_SHA" \
            --store-root "$RUNNER_TEMP/nml-ops002-diagnostic-store" \
            --writer-root "$RUNNER_TEMP/nml-ops002-diagnostic-writer" \
            --output "evidence/operational/hosted-diagnostic-$GITHUB_RUN_ID.json" \
            --authorize-diagnostic-push
      - name: Preserve factual diagnostic receipt and exact partial store
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nba-ops002-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: false
          path: |
            evidence/operational/hosted-diagnostic-*.json
            ${{ runner.temp }}/nml-ops002-diagnostic-store/records/
            ${{ runner.temp }}/nml-ops002-diagnostic-store/evidence/operational002/

  deploy:
    if: >-
      github.ref == 'refs/heads/main' && github.event_name != 'pull_request' &&
      (!inputs.release_action || inputs.release_action == 'none')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Deploy checked artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

  release-plan:
    if: >-
      github.repository == 'NickNicky19/Nicks-multisport-lab-project' &&
      github.actor == 'NickNicky19' &&
      ((github.event_name == 'workflow_dispatch' && inputs.release_action == 'plan') ||
       (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/execution/guarded-pr-') &&
        !endsWith(github.ref, '-land')))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: guarded-release-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      actions: read
      checks: read
      statuses: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Observe installed GitHub CLI version
        run: gh --version
      - name: Verify release gates under optimized Python (synthetic only)
        run: python3 -O -m unittest discover -s tests -p test_github_release.py -v
      - name: Run the exact-head guarded release plan
        run: python3 scripts/github_release.py
      - name: Retain bounded release receipts (no source capture or CI log export)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: guarded-release-plan-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: ${{ runner.temp }}/nml-guarded-release/

  release-land:
    if: >-
      github.repository == 'NickNicky19/Nicks-multisport-lab-project' &&
      github.actor == 'NickNicky19' &&
      ((github.event_name == 'workflow_dispatch' && inputs.release_action == 'land') ||
       (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/execution/guarded-pr-') &&
        endsWith(github.ref, '-land')))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: guarded-release-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      actions: write
      checks: read
      statuses: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Observe installed GitHub CLI version
        run: gh --version
      - name: Run the exact-head guarded release land
        run: python3 scripts/github_release.py
      - name: Retain bounded release receipts (no source capture or CI log export)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: guarded-release-land-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: ${{ runner.temp }}/nml-guarded-release/
