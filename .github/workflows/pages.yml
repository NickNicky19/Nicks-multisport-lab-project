name: Check and publish research site

on:
  pull_request:
  push:
    branches: [main, implementation/nba-foundation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Fetch frozen manual-cycle provenance for source-byte checks
        run: |
          git fetch --no-tags --depth=1 origin \
            58530309cf384425e15f02fd9fa980899a4dc0bc \
            c19bcd67d4fefe7f818fed569c683db9cc5ab9fc
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - name: Verify software contracts
        run: |
          python3 -m unittest discover -s tests -v
          python3 -m multisport_lab.demo
          node --test --test-isolation=none web/tests/*.test.mjs
      - name: Build bounded static research artifact
        env:
          BUILD_COMMIT: ${{ github.sha }}
        run: |
          python3 -m multisport_lab.publication --build-commit "$BUILD_COMMIT"
          node web/tests/site-smoke.mjs output
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: output

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Deploy checked artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
