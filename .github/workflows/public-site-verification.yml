name: Verify the approved public PR22 website once

on:
  push:
    branches: [verification/pr22-public-f067-20261024]

permissions:
  contents: read
  actions: read

concurrency:
  group: public-site-verification-pr22-f067
  cancel-in-progress: false

jobs:
  public-browser:
    if: >-
      github.repository == 'NickNicky19/Nicks-multisport-lab-project' &&
      github.actor == 'NickNicky19' && github.event_name == 'push' &&
      github.ref == 'refs/heads/verification/pr22-public-f067-20261024' &&
      !startsWith(github.event.head_commit.message, 'Read PR22 public evidence')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: verification
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: f06735974a388fa9e1a39e0815341de889cc25ae
          path: deployed
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Check one-off verifier syntax without executing project code
        run: python3 -m py_compile verification/scripts/verify_public_site.py
      - name: Install the pinned free browser verifier and matching Chromium
        run: |
          python3 -m pip install playwright==1.58.0
          python3 -m playwright install --with-deps chromium
      - name: Verify successful Pages identity and actual public desktop/mobile views
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 verification/scripts/verify_public_site.py
          --source-root "$GITHUB_WORKSPACE/deployed"
          --output "$RUNNER_TEMP/nml-public-site-proof"
      - name: Retain bounded public proof and screenshots only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: public-pr22-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: ${{ runner.temp }}/nml-public-site-proof/

  readiness-plan:
    if: >-
      github.repository == 'NickNicky19/Nicks-multisport-lab-project' &&
      github.actor == 'NickNicky19' && github.event_name == 'push' &&
      github.ref == 'refs/heads/verification/pr22-public-f067-20261024' &&
      startsWith(github.event.head_commit.message, 'Read PR22 public evidence')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: read
      actions: read
      checks: read
      statuses: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: cddc8be9798a4912c6893ff9dd9ee3702791a7f0
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Observe ordinary PR CI with the unchanged watcher and obtain a read-only exact-head landing plan
        run: |
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from datetime import datetime, timezone
          from pathlib import Path
          repo="NickNicky19/Nicks-multisport-lab-project";expected="cddc8be9798a4912c6893ff9dd9ee3702791a7f0"
          root=Path(os.environ["GITHUB_WORKSPACE"])/"candidate"
          out=Path(os.environ["RUNNER_TEMP"])/"nml-public-evidence-readback";out.mkdir(parents=True,exist_ok=True)
          def invoke(args,timeout):
              p=subprocess.run(args,cwd=root,capture_output=True,text=True,timeout=timeout)
              if len(p.stdout.encode())+len(p.stderr.encode())>2*1024*1024: raise RuntimeError("Readiness receipt exceeds 2 MiB")
              return p
          sha=subprocess.run(["git","rev-parse","HEAD"],cwd=root,capture_output=True,text=True,check=True).stdout.strip()
          if sha!=expected: raise RuntimeError("Readiness checkout differs")
          watch=invoke(["python3","tools/pr_completion/pr_watch.py","--target",str(root)+"=https://github.com/"+repo+"/pull/24","--mode","until-actionable","--interval","15","--max-interval","60","--timeout","1200","--cursor",str(out/"cursor.json"),"--observations-file",str(out/"observations.ndjson")],1250)
          (out/"watcher.json").write_text(watch.stdout)
          try: observation=json.loads(watch.stdout)
          except ValueError: raise RuntimeError("Watcher did not emit its original JSON")
          if observation.get("state")!="ready":
              print(json.dumps({"schema_version":"nml-pr24-readiness-summary-v1","state":observation.get("state"),"head":expected,"run_id":os.environ["GITHUB_RUN_ID"],"watcher_exit":watch.returncode,"merge_mutations":0,"provider_requests":0},sort_keys=True))
              raise RuntimeError("Current exact-head readiness is not ready; inspect original watcher receipt")
          check=invoke(["gh","pr","view","24","--repo",repo,"--json","headRefOid"],60)
          if check.returncode or json.loads(check.stdout).get("headRefOid")!=expected: raise RuntimeError("PR changed before read-only landing plan")
          plan=invoke(["python3","tools/pr_completion/pr_land.py","--repo",str(root),"--pr","https://github.com/"+repo+"/pull/24","--head",expected,"--mode","auto","--method","merge"],180)
          (out/"canonical-plan.json").write_text(plan.stdout)
          try: canonical=json.loads(plan.stdout)
          except ValueError: raise RuntimeError("Landing helper did not emit canonical JSON")
          receipt={"schema_version":"nml-pr24-readiness-summary-v1","head":expected,"source_commit":"18ec769acf2f237eeba09aaa4e03b6a0caa04a44","run_id":os.environ["GITHUB_RUN_ID"],"execution_sha":os.environ["GITHUB_SHA"],"observed_at":datetime.now(timezone.utc).isoformat(),"watcher":observation,"canonical_plan":canonical,"plan_exit":plan.returncode,"merge_mutations":0,"deployments_requested":0,"provider_requests":0,"forecasts_generated":0}
          encoded=json.dumps(receipt,sort_keys=True,separators=(",",":")).encode()
          if len(encoded)>262144: raise RuntimeError("Readiness summary exceeds 256 KiB")
          (out/"evidence.json").write_bytes(encoded+b"\n");print(encoded.decode())
          if plan.returncode: raise RuntimeError("Canonical plan was not ready; preserve original helper result")
          
          PY
      - name: Retain bounded evidence readback only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: public-evidence-readback-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/nml-public-evidence-readback/evidence.json
            ${{ runner.temp }}/nml-public-evidence-readback/watcher.json
            ${{ runner.temp }}/nml-public-evidence-readback/canonical-plan.json
            ${{ runner.temp }}/nml-public-evidence-readback/cursor.json
            ${{ runner.temp }}/nml-public-evidence-readback/observations.ndjson
