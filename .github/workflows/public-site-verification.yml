name: Verify the approved public PR22 website once

on:
  push:
    branches: [verification/pr22-public-f067-20261024]

permissions:
  contents: read
  actions: read

concurrency:
  group: public-site-verification-pr22-f067
  cancel-in-progress: false

jobs:
  public-browser:
    if: >-
      github.repository == 'NickNicky19/Nicks-multisport-lab-project' &&
      github.actor == 'NickNicky19' && github.event_name == 'push' &&
      github.ref == 'refs/heads/verification/pr22-public-f067-20261024' &&
      !startsWith(github.event.head_commit.message, 'Read PR22 public evidence')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: verification
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: f06735974a388fa9e1a39e0815341de889cc25ae
          path: deployed
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Check one-off verifier syntax without executing project code
        run: python3 -m py_compile verification/scripts/verify_public_site.py
      - name: Install the pinned free browser verifier and matching Chromium
        run: |
          python3 -m pip install playwright==1.58.0
          python3 -m playwright install --with-deps chromium
      - name: Verify successful Pages identity and actual public desktop/mobile views
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 verification/scripts/verify_public_site.py
          --source-root "$GITHUB_WORKSPACE/deployed"
          --output "$RUNNER_TEMP/nml-public-site-proof"
      - name: Retain bounded public proof and screenshots only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: public-pr22-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: ${{ runner.temp }}/nml-public-site-proof/

  evidence-readback:
    if: >-
      github.repository == 'NickNicky19/Nicks-multisport-lab-project' &&
      github.actor == 'NickNicky19' && github.event_name == 'push' &&
      github.ref == 'refs/heads/verification/pr22-public-f067-20261024' &&
      startsWith(github.event.head_commit.message, 'Read PR22 public evidence')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Diagnose the actual retained native source identities without provider requests
        run: |
          python3 - <<'PY'
          import csv, hashlib, io, json, os, re, subprocess, zlib
          from datetime import datetime, timezone
          from pathlib import Path
          repo="NickNicky19/Nicks-multisport-lab-project"
          work=Path(os.environ["RUNNER_TEMP"])/"nml-public-evidence-readback"
          work.mkdir(parents=True,exist_ok=True)
          def api(path):
              p=subprocess.run(["gh","api","repos/"+repo+"/"+path],capture_output=True,text=True,timeout=40,check=True)
              if len(p.stdout.encode())>2*1024*1024: raise RuntimeError("Metadata exceeds 2 MiB")
              return json.loads(p.stdout)
          artifact=api("actions/artifacts/12555221476")
          if artifact.get("expired") or artifact.get("name")!="nba-production-prepare-40080779828-1" or artifact.get("size_in_bytes",10**9)>2*1024*1024: raise RuntimeError("Expected retained native preparation artifact unavailable")
          run=api("actions/runs/40080779828")
          if run.get("head_sha")!="f06735974a388fa9e1a39e0815341de889cc25ae" or run.get("event")!="schedule": raise RuntimeError("Native run identity differs")
          download=work/"native-original"
          subprocess.run(["gh","run","download","40080779828","--repo",repo,"--name","nba-production-prepare-40080779828-1","--dir",str(download)],check=True,timeout=120,capture_output=True)
          files=[]; audits=[]; total=0
          for path in sorted(download.rglob("*")):
              if not path.is_file(): continue
              raw=path.read_bytes(); total+=len(raw)
              if total>4*1024*1024: raise RuntimeError("Recovered native artifact exceeds diagnostic bound")
              rel=str(path.relative_to(download))
              files.append({"path":rel,"bytes":len(raw),"sha256":hashlib.sha256(raw).hexdigest()})
              try:
                  reader=csv.DictReader(io.StringIO(raw.decode("utf-8-sig"),newline=""))
                  fields=reader.fieldnames or []
                  roles={"schedule":["id","game_id","home_id","away_id"],"roster":["athlete_id","team_id"]}
                  for role,keys in roles.items():
                      if not set(keys)<=set(fields): continue
                      rows=list(reader); bad=[]
                      for i,row in enumerate(rows,2):
                          for key in keys:
                              value=row.get(key)
                              if type(value) is not str or re.fullmatch(r"[1-9][0-9]*",value) is None:
                                  bad.append({"csv_line":i,"field":key,"value":value,"uid":row.get("uid"),"season":row.get("season"),"event_date":row.get("date"),"home_label":row.get("home_display_name"),"away_label":row.get("away_display_name"),"status":row.get("status_type_name"),"season_type":row.get("season_type")})
                      if len(bad)>10000: raise RuntimeError("Noncanonical identity audit exceeds explicit output bound")
                      audits.append({"path":rel,"role":role,"rows":len(rows),"bad_count":len(bad),"first_bad":bad[:20],"bad_values":sorted({str(v["value"]) for v in bad})[:40],"next_game_date_rows":[{key:row.get(key) for key in ["id","date","home_id","away_id","home_display_name","away_display_name","status_type_name","status_type_state","status_type_completed","time_valid"]} for row in rows if role=="schedule" and str(row.get("date","")).startswith("2026-10-25")]})
              except (UnicodeError,csv.Error): pass
          chunk="object-ff81300f1dc70f6e23f502214a77c1b0113935632453c2700ed29890c44aebc2.z"
          chunk_dir=work/"registry-object"; chunk_dir.mkdir()
          subprocess.run(["gh","release","download","nml-nba-records-v1-202610","--repo",repo,"--pattern",chunk,"--dir",str(chunk_dir)],check=True,capture_output=True,timeout=80)
          packed=(chunk_dir/chunk).read_bytes()
          if len(packed)!=1036 or hashlib.sha256(packed).hexdigest()!="ff81300f1dc70f6e23f502214a77c1b0113935632453c2700ed29890c44aebc2": raise RuntimeError("Retained registry object differs")
          decoder=zlib.decompressobj(); registry_raw=decoder.decompress(packed,2178)
          if len(registry_raw)!=2177 or not decoder.eof or decoder.unused_data or decoder.unconsumed_tail or hashlib.sha256(registry_raw).hexdigest()!="5a5f50c9f33615065b888b93c9f284b932ba59e7b96e701c734dfc73e1230919": raise RuntimeError("Retained registry bytes differ")
          registry=json.loads(registry_raw)
          report={"schema_version":"nml-native-identity-diagnosis-v1","readback_at":datetime.now(timezone.utc).isoformat(),"execution_sha":os.environ["GITHUB_SHA"],"diagnostic_run":os.environ["GITHUB_RUN_ID"],"native_run":40080779828,"native_artifact":12555221476,"native_source":run["head_sha"],"files":files,"identity_audits":audits,"registry":registry,"sports_source_requests":0,"forecasts_generated":0,"records_written":0}
          encoded=json.dumps(report,sort_keys=True,separators=(",",":")).encode()
          if len(encoded)>65536: raise RuntimeError("Forensic summary exceeds 64 KiB; no truncation")
          (work/"evidence.json").write_bytes(encoded+b"\n")
          print(encoded.decode())
          PY
      - name: Retain bounded evidence readback only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: public-evidence-readback-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: ${{ runner.temp }}/nml-public-evidence-readback/evidence.json
