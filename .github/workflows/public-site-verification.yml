name: Verify the approved public PR22 website once

on:
  push:
    branches: [verification/pr22-public-f067-20261024]

permissions:
  contents: read
  actions: read

concurrency:
  group: public-site-verification-pr22-f067
  cancel-in-progress: false

jobs:
  public-browser:
    if: >-
      github.repository == 'NickNicky19/Nicks-multisport-lab-project' &&
      github.actor == 'NickNicky19' && github.event_name == 'push' &&
      github.ref == 'refs/heads/verification/pr22-public-f067-20261024' &&
      !startsWith(github.event.head_commit.message, 'Read PR22 public evidence')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: verification
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: f06735974a388fa9e1a39e0815341de889cc25ae
          path: deployed
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Check one-off verifier syntax without executing project code
        run: python3 -m py_compile verification/scripts/verify_public_site.py
      - name: Install the pinned free browser verifier and matching Chromium
        run: |
          python3 -m pip install playwright==1.58.0
          python3 -m playwright install --with-deps chromium
      - name: Verify successful Pages identity and actual public desktop/mobile views
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 verification/scripts/verify_public_site.py
          --source-root "$GITHUB_WORKSPACE/deployed"
          --output "$RUNNER_TEMP/nml-public-site-proof"
      - name: Retain bounded public proof and screenshots only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: public-pr22-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: ${{ runner.temp }}/nml-public-site-proof/

  evidence-readback:
    if: >-
      github.repository == 'NickNicky19/Nicks-multisport-lab-project' &&
      github.actor == 'NickNicky19' && github.event_name == 'push' &&
      github.ref == 'refs/heads/verification/pr22-public-f067-20261024' &&
      startsWith(github.event.head_commit.message, 'Read PR22 public evidence')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 18ec769acf2f237eeba09aaa4e03b6a0caa04a44
          path: candidate
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: f06735974a388fa9e1a39e0815341de889cc25ae
          path: deployed
          fetch-depth: 1
          persist-credentials: false
      - name: Verify source repair and restart regressions without source collection or forecasting
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, subprocess, sys, time
          from datetime import datetime, timezone
          from pathlib import Path
          repo="NickNicky19/Nicks-multisport-lab-project"
          workspace=Path(os.environ["GITHUB_WORKSPACE"])
          candidate=workspace/"candidate"; deployed=workspace/"deployed"
          work=Path(os.environ["RUNNER_TEMP"])/"nml-public-evidence-readback";work.mkdir(parents=True,exist_ok=True)
          report={"schema_version":"nml-native-source-repair-verification-v1","started_at":datetime.now(timezone.utc).isoformat(),"source_commit":"18ec769acf2f237eeba09aaa4e03b6a0caa04a44","execution_sha":os.environ["GITHUB_SHA"],"run_id":os.environ["GITHUB_RUN_ID"],"status":"RUNNING","sports_source_requests":0,"forecasts_generated":0,"records_written":0,"checks":[]}
          def save():
              encoded=json.dumps(report,sort_keys=True,separators=(",",":")).encode()
              if len(encoded)>65536: raise RuntimeError("Bounded verification receipt exceeds 64 KiB")
              (work/"evidence.json").write_bytes(encoded+b"\n")
              print(encoded.decode(),flush=True)
          try:
              for optimized in (False,True):
                  for filename in ("test_sdv_production_inputs.py","test_sdv_production_coordinator.py"):
                      args=[sys.executable]+(["-O"] if optimized else [])+["-m","unittest","discover","-s","tests","-p",filename,"-v"]
                      before=time.monotonic()
                      p=subprocess.run(args,cwd=candidate,capture_output=True,text=True,timeout=300)
                      output=p.stdout+p.stderr
                      if len(output.encode())>2*1024*1024: raise RuntimeError("Focused test output exceeds 2 MiB")
                      match=re.search(r"Ran (\d+) tests? in ([0-9.]+)s",output)
                      item={"command":" ".join(args),"returncode":p.returncode,"wall_seconds":round(time.monotonic()-before,6),"tests":None if not match else int(match.group(1)),"suite_seconds":None if not match else float(match.group(2))}
                      report["checks"].append(item)
                      if p.returncode or not match:
                          item["failure_tail"]=output.splitlines()[-30:];save();raise RuntimeError("Focused regression failed: "+filename)
              os.chdir(candidate);sys.path.insert(0,str(candidate))
              from multisport_lab import sdv_production_archive as archives, sdv_production_runner as runner, sdv_production_inputs as inputs, sdv_production_forecasts as forecasts, sdv_production_common as common
              from multisport_lab.integrity import IntegrityError,canonical
              ref={"bytes":8797,"name":"object-226339d041081220d9cfa777494a35440ade35bd307dac36e846bca63e73ce77.z","sha256":"226339d041081220d9cfa777494a35440ade35bd307dac36e846bca63e73ce77","tag":"nml-nba-records-v1-202610"}
              archive=archives.GitHubReleaseArchive(write_budget_bytes=0,write_budget_objects=0)
              pack,sources=runner.recover_source_pack(ref,archive)
              if set(sources)!={"schedule","roster"} or len(pack["requests"])!=6: raise RuntimeError("Retained native source roles/request count differ")
              s,r=sources["schedule"],sources["roster"]
              expected={"schedule":"e927b966d1fa0e3129386aac201f115d6b1ce7c5ea1cbe429a0177f1d23dcdde","roster":"02b684f0075da0b4d00f9d2c4f4d03a8b5badf395824f30ca233e1df7f8c5ac5"}
              for role,value in sources.items():
                  if hashlib.sha256(value[0]).hexdigest()!=expected[role]: raise RuntimeError("Retained original SHA differs")
                  (work/(role+".csv")).write_bytes(value[0])
              policy=json.loads((candidate/"config/sdv_production_policy_v2.json").read_text())
              strict="from pathlib import Path; from multisport_lab.sdv_production_inputs import _tables; import sys; _tables(Path(sys.argv[1]).read_bytes(),Path(sys.argv[2]).read_bytes())"
              p=subprocess.run([sys.executable,"-c",strict,str(work/"schedule.csv"),str(work/"roster.csv")],cwd=deployed,capture_output=True,text=True,timeout=30,env=dict(os.environ,PYTHONPATH=str(deployed)))
              if p.returncode==0 or "Invalid production identity" not in p.stderr: raise RuntimeError("Original deployed failure did not reproduce on retained bytes")
              report["original_failure_reproduced"]="Invalid production identity"
              binding=forecasts.make_source_binding("18ec769acf2f237eeba09aaa4e03b6a0caa04a44",root=candidate)
              plan=inputs.make_plan(s[0],r[0],s[1],r[1],source_originals={"schedule":s[2],"roster":r[2]},game_date="2026-10-25",producer_binding=binding,mode="DEVELOPMENT_ONLY",policy=policy)
              inputs.verify_plan_sources(plan,s[0],r[0],s[1],r[1],source_originals={"schedule":s[2],"roster":r[2]})
              if len(plan["events"])!=11 or plan["source_schedule_rows"]!=1206: raise RuntimeError("Complete retained target inventory differs")
              for event in plan["events"]:
                  body=inputs.make_input(plan,event["event"]["event_id"],s[0],r[0],s[1],r[1],source_originals={"schedule":s[2],"roster":r[2]},mode="DEVELOPMENT_ONLY")
                  inputs.verify_input_sources(body,s[0],r[0],s[1],r[1],source_originals={"schedule":s[2],"roster":r[2]},plan=plan)
              try: inputs._tables(s[0],r[0],policy)
              except IntegrityError: report["no_context_import_rejected"]=True
              else: raise RuntimeError("No-context source import was weakened")
              try: inputs._tables(s[0],r[0],policy,"2026-12-04")
              except IntegrityError: report["target_date_tbd_rejected"]=True
              else: raise RuntimeError("Target-date TBD identity was admitted")
              source_rows,_=inputs._tables(s[0],r[0],policy,"2026-10-25")
              deferred=[{key:row[key] for key in ("id","date","home_id","away_id","home_display_name","away_display_name")} for row in source_rows if row["home_id"]=="-1"]
              report["retained_replay"]={"mode":"DEVELOPMENT_ONLY","source_pack_ref":ref,"original_capture_at":pack["captured_at"],"original_source_run":pack["authorization"]["run_id"],"original_source_head":pack["authorization"]["head_sha"],"original_provider_gets":len(pack["requests"]),"sources":[sources[role][1] for role in ("schedule","roster")],"schedule_rows":len(source_rows),"roster_rows":len(inputs._tables(s[0],r[0],policy,"2026-10-25")[1]),"outside_game_date_rows":plan["outside_game_date_rows"],"events":len(plan["events"]),"players":sum(len(event["candidates"]) for event in plan["events"]),"shards":sum(len(event["shards"]) for event in plan["events"]),"exclusions":len(plan["exclusions"]),"plan_id":plan["plan_id"],"deferred_future_placeholders":deferred,"archive_read_metrics":archive.request_metrics(),"first_windows":[{key:plan["events"][0][key] for key in ("cycle_id","cutoff_at","capture_opens_at","issuance_closes_at")}]}
              report.update(status="PASS",completed_at=datetime.now(timezone.utc).isoformat());save()
          except Exception as error:
              report.update(status="FAIL",error=str(error)[:800],completed_at=datetime.now(timezone.utc).isoformat());save();raise
          
          PY
      - name: Retain bounded evidence readback only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: public-evidence-readback-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: ${{ runner.temp }}/nml-public-evidence-readback/evidence.json
