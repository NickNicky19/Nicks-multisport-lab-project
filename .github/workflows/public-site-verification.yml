name: Verify the approved public PR22 website once

on:
  push:
    branches: [verification/pr22-public-f067-20261024]

permissions:
  contents: read
  actions: read

concurrency:
  group: public-site-verification-pr22-f067
  cancel-in-progress: false

jobs:
  public-browser:
    if: >-
      github.repository == 'NickNicky19/Nicks-multisport-lab-project' &&
      github.actor == 'NickNicky19' && github.event_name == 'push' &&
      github.ref == 'refs/heads/verification/pr22-public-f067-20261024' &&
      !startsWith(github.event.head_commit.message, 'Read PR22 public evidence')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: verification
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: f06735974a388fa9e1a39e0815341de889cc25ae
          path: deployed
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Check one-off verifier syntax without executing project code
        run: python3 -m py_compile verification/scripts/verify_public_site.py
      - name: Install the pinned free browser verifier and matching Chromium
        run: |
          python3 -m pip install playwright==1.58.0
          python3 -m playwright install --with-deps chromium
      - name: Verify successful Pages identity and actual public desktop/mobile views
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 verification/scripts/verify_public_site.py
          --source-root "$GITHUB_WORKSPACE/deployed"
          --output "$RUNNER_TEMP/nml-public-site-proof"
      - name: Retain bounded public proof and screenshots only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: public-pr22-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: ${{ runner.temp }}/nml-public-site-proof/

  release-prepare:
    if: >-
      github.repository == 'NickNicky19/Nicks-multisport-lab-project' &&
      github.actor == 'NickNicky19' && github.event_name == 'push' &&
      github.ref == 'refs/heads/verification/pr22-public-f067-20261024' &&
      startsWith(github.event.head_commit.message, 'Read PR22 public evidence')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Open the verified repair PR and request its ordinary feature-branch CI
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from datetime import datetime, timezone
          from pathlib import Path
          repo="NickNicky19/Nicks-multisport-lab-project"; branch="implementation/sdv-publisher-identity-recovery"
          expected="cddc8be9798a4912c6893ff9dd9ee3702791a7f0"
          if os.environ.get("GITHUB_EVENT_NAME")!="push" or os.environ.get("GITHUB_ACTOR")!="NickNicky19" or os.environ.get("GITHUB_REF")!="refs/heads/verification/pr22-public-f067-20261024" or os.environ.get("GITHUB_RUN_ATTEMPT")!="1": raise RuntimeError("Unexpected release-preparation authority or retry")
          work=Path(os.environ["RUNNER_TEMP"])/"nml-public-evidence-readback";work.mkdir(parents=True,exist_ok=True)
          def run(args):
              p=subprocess.run(["gh",*args],capture_output=True,text=True,timeout=60)
              if len(p.stdout.encode())+len(p.stderr.encode())>2*1024*1024: raise RuntimeError("Release metadata exceeds 2 MiB")
              if p.returncode: raise RuntimeError("GitHub CLI release preparation failed: "+p.stderr[-1200:])
              return p.stdout
          def api(path): return json.loads(run(["api","repos/"+repo+"/"+path]))
          main=api("git/ref/heads/main")["object"]["sha"]
          head=api("git/ref/heads/"+branch)["object"]["sha"]
          if main!="f06735974a388fa9e1a39e0815341de889cc25ae" or head!=expected: raise RuntimeError("New main/head work observed; preserve it and re-review")
          commit=api("git/commits/"+head)
          if commit["tree"]["sha"]!="6d4ba723cc3cb183db7136565d58fdcf7141784a" or [row["sha"] for row in commit["parents"]]!=["18ec769acf2f237eeba09aaa4e03b6a0caa04a44"]: raise RuntimeError("Final candidate tree/ancestry differs")
          body="The native coordinator stopped after a successful six-request source capture because six later December TBD games use unresolved team IDs. This repair keeps those complete original rows while allowing only the verified future-date placeholder signature outside the selected UTC date. Target-date and normalized identities remain strict.\n\nPlanning restarts now recover the earliest completed same-date capture before any new provider request. They preserve original clocks and attempt limits, authenticate reservation/request linkage, and retain current freshness, runtime and planning-window gates. Missing, corrupt or stale originals do not trigger replacement captures.\n\nVerified source: `18ec769acf2f237eeba09aaa4e03b6a0caa04a44`. Hosted focused checks passed 17 input and 26 coordinator tests, both normally and under optimized Python. Independent durable archive recovery reproduced the original deployed error and passed the corrected DEVELOPMENT_ONLY plan plus all input replays: 1,206 schedule rows, 516 roster rows, 11 games, 382 candidates and 32 shards. No new provider request or genuine forecast was produced. Full candidate CI is a separate required gate.\n\nThis also retains PR #22's actual merge/Pages/public-browser evidence. R0/K0 laws, all 14 categories, fixed history, protected pilots, original records, policies, workflows, source/archive/ledger limits and NO_ACTION are unchanged. No future issuance, final grade, model qualification, odds or financial settlement is claimed.\n\nSee HANDOFF_STATUS.md and the three new structured deployment/source receipts for exact run IDs, clocks, commands, results and remaining operating verification."
          bodyfile=work/"pr-body.txt";bodyfile.write_text(body)
          existing=json.loads(run(["pr","list","--repo",repo,"--head",branch,"--base","main","--state","open","--json","number,headRefOid,url"]))
          if len(existing)>1 or existing and existing[0]["headRefOid"]!=expected: raise RuntimeError("Existing PR/head differs")
          if existing: pr=existing[0]
          else:
              url=run(["pr","create","--repo",repo,"--base","main","--head",branch,"--title","Recover NBA planning from future TBD fixtures and interrupted captures","--body-file",str(bodyfile)]).strip()
              pr=json.loads(run(["pr","view",url,"--repo",repo,"--json","number,headRefOid,url"]))
          if pr["headRefOid"]!=expected: raise RuntimeError("Created PR does not reference the tested source")
          receipt={"schema_version":"nml-source-repair-pr-preparation-v1","repository":repo,"branch":branch,"head":expected,"source_commit":"18ec769acf2f237eeba09aaa4e03b6a0caa04a44","pr":pr,"started_at":datetime.now(timezone.utc).isoformat(),"dispatch_state":"INTENT_RETAINED","merge_mutations":0,"deployments_requested":0,"sports_source_requests":0,"production_record_writes":0}
          (work/"evidence.json").write_text(json.dumps(receipt,sort_keys=True)+"\n")
          run(["workflow","run","pages.yml","--repo",repo,"--ref",branch])
          receipt.update(dispatch_state="ACKNOWLEDGED_EXECUTION_UNVERIFIED",completed_at=datetime.now(timezone.utc).isoformat())
          (work/"evidence.json").write_text(json.dumps(receipt,sort_keys=True)+"\n")
          print(json.dumps(receipt,sort_keys=True))
          
          PY
      - name: Retain bounded evidence readback only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: public-evidence-readback-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: ${{ runner.temp }}/nml-public-evidence-readback/evidence.json
