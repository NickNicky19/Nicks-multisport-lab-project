name: Verify the approved public PR22 website once

on:
  push:
    branches: [verification/pr22-public-f067-20261024]

permissions:
  contents: read
  actions: read

concurrency:
  group: public-site-verification-pr22-f067
  cancel-in-progress: false

jobs:
  public-browser:
    if: >-
      github.repository == 'NickNicky19/Nicks-multisport-lab-project' &&
      github.actor == 'NickNicky19' && github.event_name == 'push' &&
      github.ref == 'refs/heads/verification/pr22-public-f067-20261024' &&
      !startsWith(github.event.head_commit.message, 'Read PR22 public evidence')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: verification
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: f06735974a388fa9e1a39e0815341de889cc25ae
          path: deployed
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Check one-off verifier syntax without executing project code
        run: python3 -m py_compile verification/scripts/verify_public_site.py
      - name: Install the pinned free browser verifier and matching Chromium
        run: |
          python3 -m pip install playwright==1.58.0
          python3 -m playwright install --with-deps chromium
      - name: Verify successful Pages identity and actual public desktop/mobile views
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 verification/scripts/verify_public_site.py
          --source-root "$GITHUB_WORKSPACE/deployed"
          --output "$RUNNER_TEMP/nml-public-site-proof"
      - name: Retain bounded public proof and screenshots only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: public-pr22-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: ${{ runner.temp }}/nml-public-site-proof/

  evidence-readback:
    if: >-
      github.repository == 'NickNicky19/Nicks-multisport-lab-project' &&
      github.actor == 'NickNicky19' && github.event_name == 'push' &&
      github.ref == 'refs/heads/verification/pr22-public-f067-20261024' &&
      startsWith(github.event.head_commit.message, 'Read PR22 public evidence')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Recover the existing public proof and inspect registered operation state
        run: |
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from datetime import datetime, timezone
          from pathlib import Path
          repo="NickNicky19/Nicks-multisport-lab-project"
          def api(path):
              p=subprocess.run(["gh","api","repos/"+repo+"/"+path],capture_output=True,text=True,timeout=40,check=True)
              if len(p.stdout.encode())>2*1024*1024: raise RuntimeError("Metadata exceeds 2 MiB")
              return json.loads(p.stdout)
          work=Path(os.environ["RUNNER_TEMP"])/"nml-public-evidence-readback"
          work.mkdir(parents=True,exist_ok=True)
          artifact=api("actions/artifacts/12554484552")
          if artifact.get("expired") or artifact.get("name")!="public-pr22-40080319441-1" or artifact.get("size_in_bytes",10**9)>40*1024*1024:
              raise RuntimeError("Expected bounded public verification artifact is not available")
          proof_run=api("actions/runs/40080319441")
          if proof_run.get("conclusion")!="success" or proof_run.get("head_sha")!="c643cd9386542c632f012a635bd025787a98c5b7":
              raise RuntimeError("Original public verification run identity differs")
          download=work/"original"
          subprocess.run(["gh","run","download","40080319441","--repo",repo,"--name","public-pr22-40080319441-1","--dir",str(download)],check=True,timeout=120,capture_output=True)
          raw=(download/"public-verification.json").read_bytes()
          if len(raw)>1024*1024: raise RuntimeError("Public proof exceeds 1 MiB")
          proof=json.loads(raw)
          if proof.get("status")!="PASS" or proof.get("public_verified") is not True or proof.get("expected_build")!="f06735974a388fa9e1a39e0815341de889cc25ae" or proof.get("verifier_sha256")!="802196ac1b18b1b6527ab0c3f5adc53385cbe099b431c139feeaf78d779164de":
              raise RuntimeError("Original public proof is not the verified deployed build")
          workflow=api("actions/workflows/392458906")
          runs=api("actions/runs?event=schedule&per_page=5")
          registry=api("git/ref/heads/records/sdv-production-index")
          main=api("git/ref/heads/main")
          selected_runs=[{k:v.get(k) for k in ["id","head_sha","status","conclusion","created_at","run_started_at","updated_at","event","path"]} for v in runs.get("workflow_runs",[]) if v.get("workflow_id")==392458906]
          report={"schema_version":"nml-pr22-postdeployment-readback-v1","readback_at":datetime.now(timezone.utc).isoformat(),"execution_sha":os.environ["GITHUB_SHA"],"readback_run_id":os.environ["GITHUB_RUN_ID"],"source_public_report_sha256":hashlib.sha256(raw).hexdigest(),"source_artifact_id":12554484552,"public_verification":proof,"operations":{"workflow":{k:workflow.get(k) for k in ["id","name","path","state","created_at","updated_at"]},"latest_scheduled_runs":selected_runs,"registry_commit":registry["object"]["sha"],"main_commit":main["object"]["sha"]},"sports_source_requests":0,"forecasts_generated":0,"merge_mutations":0}
          encoded=json.dumps(report,sort_keys=True,separators=(",",":")).encode()
          if len(encoded)>65536: raise RuntimeError("Compact durable evidence exceeds 64 KiB; no truncation")
          (work/"evidence.json").write_bytes(encoded+b"\n")
          print(encoded.decode())
          PY
      - name: Retain bounded evidence readback only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: public-evidence-readback-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: ${{ runner.temp }}/nml-public-evidence-readback/evidence.json
